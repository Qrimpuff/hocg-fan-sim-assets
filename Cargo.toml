[workspace]
members = ["model", "cli"]
resolver = "3"


[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
hocg-fan-sim-assets-cli = { path = "cli", version = "*" }
hocg-fan-sim-assets-model = { path = "model", version = "*" }
clap = { version = "4.6.7", features = ["derive"] }
dotenvy = "0.15.7"
httpdate = "1.0.3"
image = "0.25.10"
image_hasher = "3.1.1"
indexmap = "2.14.2"
itertools = "0.15.0"
json-pretty-compact = "0.1.2"
oxipng = "10.2.1"
palette = "0.7.7"
parking_lot = "0.13.0"
rayon = "1.12.0"
reqwest = { version = "0.13.5", features = [
    "blocking",
    "json",
    "cookies",
    "gzip",
    "brotli",
    "deflate",
    "query",
] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
walkdir = "2.5.0"
webp = "0.3.1"
zip = "9.4.1"
